[project]
name = "mediawiki-raw-import"
version = "0.1.0"
description = "Export MediaWiki wikitext into a vault raw subfolder"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wiki-dump-raw = "wiki_dump:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wiki_dump"]
